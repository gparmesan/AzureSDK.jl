# Azurite (the MIT-licensed Azure Storage emulator) for the Blob Storage
# integration tests:
#
#   docker compose -f test/emulator/azurite-compose.yml up -d
#   AZURESDK_AZURITE=1 julia --project -e 'using Pkg; Pkg.test()'
#
# The Event Hubs compose file starts an Azurite on the same port, so either
# one can be used.
name: azuresdk-jl-azurite

services:
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    command: azurite-blob --blobHost 0.0.0.0 --skipApiVersionCheck --inMemoryPersistence
    ports:
      - "127.0.0.1:10000:10000"
