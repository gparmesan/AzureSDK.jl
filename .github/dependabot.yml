# Keeps the GitHub Actions (pinned by commit SHA) and the emulator images
# used by the workflows up to date.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  # Emulator images in the docker compose files (pinned by version and digest).
  - package-ecosystem: docker-compose
    directory: /test/emulator
    schedule:
      interval: monthly
