name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    # Fails if any Julia file is not formatted with Runic (see docs/src/testing.md).
    name: Runic formatting
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: julia-actions/setup-julia@da908477b5db94c10ffce8cfea9f2b3b9d5db687 # v3.0.3
        with:
          version: "1"
      - uses: julia-actions/cache@d10a6fd8f31b12404a54613ebad242900567f2b9 # v2.1.0
      - uses: fredrikekre/runic-action@b4dbd650db5cc684baae27fea45d22daf41693c2 # v1.5.0
        with:
          version: "1"

  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        version: ["1.10", "1"]
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: julia-actions/setup-julia@da908477b5db94c10ffce8cfea9f2b3b9d5db687 # v3.0.3
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@d10a6fd8f31b12404a54613ebad242900567f2b9 # v2.1.0
      - uses: julia-actions/julia-buildpkg@e3eb439fad4f9aba7da2667e7510e4a46ebc46e1 # v1.7.0
      - uses: julia-actions/julia-runtest@6e050c8013b833b1195105ff2fce9cd802f53271 # v1.12.0
        env:
          JULIA_NUM_THREADS: "4"
      - uses: julia-actions/julia-processcoverage@03114f09f119417c3242a9fb6e0b722676aedf38 # v1.2.2
      - uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  azurite:
    # Blob Storage integration tests against Azurite (MIT licensed; no EULA,
    # so this job always runs).
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Start Azurite
        run: docker compose -f test/emulator/azurite-compose.yml up -d
      - uses: julia-actions/setup-julia@da908477b5db94c10ffce8cfea9f2b3b9d5db687 # v3.0.3
        with:
          version: "1"
      - uses: julia-actions/cache@d10a6fd8f31b12404a54613ebad242900567f2b9 # v2.1.0
      - uses: julia-actions/julia-buildpkg@e3eb439fad4f9aba7da2667e7510e4a46ebc46e1 # v1.7.0
      - name: Wait for Azurite
        run: |
          for i in $(seq 1 30); do
            curl -s -o /dev/null http://127.0.0.1:10000/ && exit 0
            sleep 2
          done
          docker compose -f test/emulator/azurite-compose.yml logs
          exit 1
      - uses: julia-actions/julia-runtest@6e050c8013b833b1195105ff2fce9cd802f53271 # v1.12.0
        env:
          AZURESDK_AZURITE: "1"
          JULIA_NUM_THREADS: "4"
      - uses: julia-actions/julia-processcoverage@03114f09f119417c3242a9fb6e0b722676aedf38 # v1.2.2
      - uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  emulator:
    # Runs the integration tests against the Event Hubs emulator and Azurite.
    # Starting the emulator accepts Microsoft's emulator license terms, so this
    # job only runs when the repository variable ACCEPT_EMULATOR_EULA is "Y".
    if: ${{ vars.ACCEPT_EMULATOR_EULA == 'Y' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Start emulators
        run: docker compose -f test/emulator/docker-compose.yml up -d
        env:
          ACCEPT_EULA: "Y"
      - name: Wait for the Event Hubs emulator
        run: |
          for i in $(seq 1 60); do
            docker compose -f test/emulator/docker-compose.yml logs eventhubs | grep -q "Emulator Service is Successfully Up" && exit 0
            sleep 5
          done
          docker compose -f test/emulator/docker-compose.yml logs
          exit 1
      - uses: julia-actions/setup-julia@da908477b5db94c10ffce8cfea9f2b3b9d5db687 # v3.0.3
        with:
          version: "1"
      - uses: julia-actions/cache@d10a6fd8f31b12404a54613ebad242900567f2b9 # v2.1.0
      - uses: julia-actions/julia-buildpkg@e3eb439fad4f9aba7da2667e7510e4a46ebc46e1 # v1.7.0
      - uses: julia-actions/julia-runtest@6e050c8013b833b1195105ff2fce9cd802f53271 # v1.12.0
        env:
          AZURESDK_EVENTHUBS_EMULATOR: "1"
          AZURESDK_AZURITE: "1"
          JULIA_NUM_THREADS: "4"

  servicebus-emulator:
    # Integration tests against the Service Bus emulator (needs SQL Server).
    # Opt-in for the same reason as the Event Hubs emulator job.
    if: ${{ vars.ACCEPT_EMULATOR_EULA == 'Y' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Start the Service Bus emulator
        run: |
          echo "MSSQL_SA_PASSWORD=$(openssl rand -hex 16)Aa1!" >> "$GITHUB_ENV"
      - run: docker compose -f test/emulator/servicebus-compose.yml up -d
        env:
          ACCEPT_EULA: "Y"
      - name: Wait for the Service Bus emulator
        run: |
          for i in $(seq 1 60); do
            docker compose -f test/emulator/servicebus-compose.yml logs servicebus | grep -q "Successfully Up" && exit 0
            sleep 5
          done
          docker compose -f test/emulator/servicebus-compose.yml logs
          exit 1
      - uses: julia-actions/setup-julia@da908477b5db94c10ffce8cfea9f2b3b9d5db687 # v3.0.3
        with:
          version: "1"
      - uses: julia-actions/cache@d10a6fd8f31b12404a54613ebad242900567f2b9 # v2.1.0
      - uses: julia-actions/julia-buildpkg@e3eb439fad4f9aba7da2667e7510e4a46ebc46e1 # v1.7.0
      - uses: julia-actions/julia-runtest@6e050c8013b833b1195105ff2fce9cd802f53271 # v1.12.0
        env:
          AZURESDK_SERVICEBUS_EMULATOR: "1"
          JULIA_NUM_THREADS: "4"
