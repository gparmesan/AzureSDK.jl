# Opens pull requests that widen [compat] bounds when dependencies release new
# major versions.
name: CompatHelper

on:
  schedule:
    - cron: "0 4 * * 1" # Mondays 04:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  CompatHelper:
    runs-on: ubuntu-latest
    steps:
      - uses: julia-actions/setup-julia@4c0cb0fce8556fdb04a90347310e5db8b1f98fb9 # v2.7.0
        with:
          version: "1"
      - name: Install CompatHelper
        run: julia -e 'using Pkg; Pkg.add("CompatHelper")'
      - name: Run CompatHelper
        run: julia -e 'using CompatHelper; CompatHelper.main(; subdirs = ["", "docs"])'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional deploy key so that CompatHelper's pull requests trigger CI
          # (pull requests opened with GITHUB_TOKEN do not start workflows).
          COMPATHELPER_PRIV: ${{ secrets.DOCUMENTER_KEY }}
